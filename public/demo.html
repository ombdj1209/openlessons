<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLessons demo</title>
  <meta name="description" content="A one minute tour of OpenLessons: a URL shortener grows from one server, breaks under load, and gets fixed piece by piece.">
  <meta property="og:image" content="./og.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #f5f5f5; font: 15px/1.5 system-ui, sans-serif; }
    main { width: min(1200px, 100% - 32px); padding: 32px 0; }
    h1 { margin: 0 0 6px; font: 600 28px/1.2 Georgia, serif; }
    p { margin: 0 0 20px; color: #a8a8ad; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    a { color: #f5f5f5; text-decoration: none; padding: 9px 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; }
    a:hover { border-color: #ff7a3d; }
    a.solid { background: #ff7a3d; border-color: #ff7a3d; color: #000; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>OpenLessons in one minute</h1>
    <p>A URL shortener grows from one server, breaks under load, and gets fixed piece by piece. Every frame is drawn by the lesson engine.</p>
    <video src="./demo.mp4" poster="./demo-poster.png" controls preload="metadata" playsinline></video>
    <nav>
      <a class="solid" href="./#/lesson/design-url-shortener">Open this lesson</a>
      <a href="./">Browse all lessons</a>
      <a href="https://github.com/ombdj1209/openlessons">Source on GitHub</a>
    </nav>
  </main>
</body>
</html>
