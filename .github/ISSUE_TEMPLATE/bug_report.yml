name: Bug report
description: Something looks wrong, or a lesson says something incorrect
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Lesson link and step number, or the page.
      placeholder: "#/lesson/design-rate-limiter, step 9"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: shot
    attributes:
      label: Screenshot
      description: Paste an image if it helps.
